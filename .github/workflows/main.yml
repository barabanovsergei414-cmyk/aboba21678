name: Build RealWeather

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unpack
        run: unzip -q "*.zip"

      - name: Build
        working-directory: RealWeather
        run: |
          set +e
          gradle clean build --no-daemon > build.log 2>&1
          code=$?
          {
            echo '## Ошибки сборки'
            echo '```'
            grep -B1 -A3 "error:" build.log | head -150
            echo '--- конец лога ---'
            tail -40 build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $code

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: realweather-jar
          path: RealWeather/build/libs/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RealWeather build ${{ github.run_number }}
          files: RealWeather/build/libs/*.jar
